name: S3 lockfile sync (temporary)

on:
  push:
    branches: [feat/quote-approval-evidence]
    paths:
      - api/package.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.event.head_commit.message == 'chore: add S3 SDK dependency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve dependency lockfile
        working-directory: api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/package-lock.json
          git diff --cached --quiet || {
            git commit -m "chore: sync S3 dependency lockfile"
            git push origin HEAD:feat/quote-approval-evidence
          }
