name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://techpro:techpro@localhost:5432/techpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  sync-s3-lock:
    name: Resolve S3 lockfile
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ci: resolve S3 dependency lockfile'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve lockfile
        working-directory: api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency resolution
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync S3 dependency lockfile"
            git push origin HEAD:feat/quote-approval-evidence
          fi
